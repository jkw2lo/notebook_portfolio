/* ── TYPE ────────────────────────────────────────────────────
   A typeface on its own changes very little. What changes a page
   is a ROLE — header, title, caption — sized, tracked and cased
   against the others. So a kit names three faces, the roles say
   how each is set, and a kit may bend a role where its own faces
   need it (Amatic is tiny at 60px; Archivo Black is enormous).
   ═══════════════════════════════════════════════════════════════ */
const ROLES = {
  header:  ["Header",   {slot:"disp", size:62, w:600, track:-.018, caps:0, lh:1.03}],
  title:   ["Title",    {slot:"disp", size:38, w:600, track:-.01,  caps:0, lh:1.12}],
  subtitle:["Subtitle", {slot:"body", size:20, w:400, track:.004,  caps:0, lh:1.40, ital:1, dim:1}],
  kicker:  ["Kicker",   {slot:"mono", size:12, w:500, track:.26,   caps:1, lh:1.4,  dim:1}],
  body:    ["Body",     {slot:"body", size:16, w:400, track:0,     caps:0, lh:1.62}],
  quote:   ["Quote",    {slot:"disp", size:25, w:400, track:0,     caps:0, lh:1.45, ital:1}],
  caption: ["Caption",  {slot:"mono", size:11, w:400, track:.10,   caps:0, lh:1.5,  dim:1}],
  label:   ["Label",    {slot:"mono", size:10, w:500, track:.22,   caps:1, lh:1.5}]
};
const KITS = {
  Bench:      {note:"Newsreader · Karla · Plex", disp:"disp",  body:"body",   mono:"mono"},
  "Field notes":{note:"Bebas · Karla · Courier", disp:"bebas", body:"body",   mono:"courier",
    roles:{header:{size:74, track:.06, caps:1}, title:{size:44, track:.08, caps:1}}},
  Plate:      {note:"Instrument · Karla · Plex",  disp:"instr", body:"body",   mono:"mono",
    roles:{header:{size:76, track:-.02}, quote:{size:28}}},
  Almanac:    {note:"Fraunces · Cormorant · Plex",disp:"fraun", body:"corm",   mono:"mono",
    roles:{body:{size:19}, subtitle:{size:23}}},
  Ledger:     {note:"Courier throughout",         disp:"courier",body:"courier",mono:"courier",
    roles:{header:{size:36, track:.18, caps:1}, title:{size:24, track:.2, caps:1}, body:{size:14}}},
  Postcard:   {note:"Amatic · Caveat · Typewriter",disp:"amatic",body:"caveat", mono:"type",
    roles:{header:{size:96, track:.02, caps:1}, title:{size:62, caps:1}, body:{size:22}, subtitle:{size:26}}},
  Atlas:      {note:"Archivo Black · Karla · Plex",disp:"black",body:"body",   mono:"mono",
    roles:{header:{size:52, track:-.03, caps:1}, title:{size:32, caps:1}}},
  Letter:     {note:"Cormorant throughout",       disp:"corm",  body:"corm",   mono:"mono",
    roles:{header:{size:72}, body:{size:19}}},
  Journal:    {note:"Caveat · Shantell · Typewriter",disp:"caveat",body:"hand",mono:"type",
    roles:{header:{size:78}, title:{size:50}, body:{size:19}}},
  Specimen:   {note:"Newsreader · Plex · Plex",   disp:"disp",  body:"mono",   mono:"mono",
    roles:{body:{size:13, lh:1.7}, subtitle:{size:15, ital:0}}}
};
function kitOf(b){ return KITS[(b && b.kit) || (NB && NB.kit) || "Bench"] || KITS.Bench; }
function roleSpec(b){
  const r = (ROLES[b && b.role] || ROLES.body)[1];
  const k = kitOf(b);
  return Object.assign({}, r, (k.roles && k.roles[(b && b.role) || "body"]) || {});
}
/* the resolved look: role first, then anything the maker overrode */
function textStyle(b){
  const k = kitOf(b), r = roleSpec(b);
  const face = faceCSS(b.font || k[r.slot] || "body");
  const size = b.size || r.size;
  const track = b.track != null ? b.track : r.track;
  const caps = b.caps != null ? b.caps : r.caps;
  const ital = b.ital != null ? b.ital : (r.ital || 0);
  const col = b.color || (r.dim ? "#6A6257" : "#171512");
  return `font-family:${face};font-size:${size}px;font-weight:${b.weight || r.w};` +
    `letter-spacing:${track}em;line-height:${r.lh};color:${esc(col)};` +
    (caps ? "text-transform:uppercase;" : "") + (ital ? "font-style:italic;" : "");
}
function roleSize(b){ return b.size || roleSpec(b).size; }

function kitMenu(anchor, arr){
  const pv = (kit, role) => {
    const fake = {kit, role};
    return `<span style="${textStyle(fake)};font-size:${Math.min(roleSpec(fake).size, 26)}px">Aa</span>`;
  };
  popup(anchor, `<div class="gl">Type kit — sets every role at once</div>
    <div class="kitgrid">${Object.keys(KITS).map(k => `
      <button class="kitcard ${(NB.kit||"Bench")===k?"on":""}" data-kit="${esc(k)}">
        <span class="hd" style="${textStyle({kit:k,role:"title"})};font-size:22px">${esc(k)}</span>
        <span class="bd" style="${textStyle({kit:k,role:"body"})};font-size:11px">The quick brown fox</span>
        <span class="cp" style="${textStyle({kit:k,role:"label"})};font-size:8px">${esc(KITS[k].note)}</span>
      </button>`).join("")}</div>
    <hr><div class="gl">Role for the selected text</div>
    <div class="rolelist">${Object.keys(ROLES).map(r => `
      <button data-role="${r}"><span class="rp" style="${textStyle({role:r})};font-size:${
        Math.min(roleSpec({role:r}).size, 24)}px">${esc(ROLES[r][0])}</span>
      <span class="k">${roleSpec({role:r}).size}px${arr.some(b=>b.role===r)?" ✓":""}</span></button>`).join("")}</div>
    <hr><div class="gl">Override the face on this piece only</div>
    <div class="fgrid">${Object.keys(FACES).map(k =>
      `<button class="fcard" data-face="${k}" style="font-family:${faceCSS(k)}">${esc(FACES[k][0])}</button>`).join("")}</div>`,
  e => {
    const kb = e.target.closest("[data-kit]");
    if (kb){ snap(); NB.kit = kb.dataset.kit; dirty(); drawBlocks(); drawSel(); drawTools(); closePop();
      toast(`Type kit: ${kb.dataset.kit}. Every role on every page follows it.`, 3200); return; }
    const rb = e.target.closest("[data-role]");
    if (rb){
      snap(); arr.forEach(b => { if (b.t !== "text") return;
        b.role = rb.dataset.role;
        delete b.size; delete b.track; delete b.caps; delete b.ital; delete b.font;
        delete b.weight; delete b.color; b.h = 0; });
      dirty(); drawBlocks(); drawSel(); drawTools(); closePop(); return;
    }
    const fb = e.target.closest("[data-face]");
    if (fb){ snap(); arr.forEach(b => { b.font = fb.dataset.face; b.h = 0; });
      dirty(); drawBlocks(); drawSel(); drawTools(); closePop(); }
  }, "wide");
}


/* ── THE COVER ───────────────────────────────────────────────
   Not a page: a different material, no page number, and it is
   what the book opens on. It still takes pieces, so a label or a
   photograph can be stuck to it.                               */
const COVERS = {
  cloth:   ["Bookcloth", c => `background:${c};background-image:

    repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)`],
  leather: ["Leather",   c => `background:${c};background-image:
    radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.10),transparent 55%),
    radial-gradient(ellipse at 75% 75%,rgba(0,0,0,.22),transparent 60%)`],
  kraft:   ["Kraft board",c => `background:${c};background-image:
    radial-gradient(ellipse at 20% 15%,rgba(255,245,225,.20),transparent 60%),

    repeating-radial-gradient(ellipse at 72% 66%,rgba(0,0,0,.16) 0 14px,transparent 14px 34px)`],

/* ── LOCKING ─────────────────────────────────────────────────
   A locked piece is finished: it takes no pointer, cannot be
   marqueed and cannot be nudged. It is the only way to work over
   a background you have already placed.                        */
const isLocked = b => !!(b && b.lock);
function toggleLock(arr, on){
  snap();
  const v = on == null ? !arr.every(isLocked) : on;
  arr.forEach(b => { if (v) b.lock = 1; else delete b.lock; });
  dirty(); drawBlocks(); drawSel(); drawTools(); drawObjs();
  toast(v ? "Locked. Click it in the Objects list to unlock." : "Unlocked.", 2600);
}

/* ── THE OBJECT LIST ─────────────────────────────────────────
   Everything on the spread, back of the stack at the bottom, the
   way it is actually layered. Hovering lights the piece on the
   page; dragging a row restacks it.                            */
const OBJ_ICON = {photo:"▣", text:"T", note:"▤", swatch:"◧", spec:"≣", shape:"◆", stitch:"┈",
  tape:"▬", scrap:"▨", tag:"⬟", ticket:"🎟", stamp:"▦", ribbon:"➤", date:"▢", check:"☑",
  ink:"✎", sticker:"✦", doodle:"✐", time:"⌇", month:"▦", track:"▥", mood:"☺", rate:"★",
  quote:"❝", mark:"◉", clip:"🖇", seal:"✹", env:"✉", lace:"︵", libcard:"▤", post:"✉"};
function objName(b){
  if (b.t === "text") return (b.text || "").slice(0, 34) || "Empty text";
  if (b.t === "note") return (b.text || "").slice(0, 34) || "Note";
  if (b.t === "photo") return b.caption || (b.src ? "Photograph" : "Empty photo frame");
  if (b.t === "sticker") return skName(b.key);
  if (b.t === "doodle") return (DOODLES[b.key] || ["Mark"])[0];
  if (b.t === "date") return dateText(b);
  if (b.t === "spec") return b.title || "Spec table";
  if (b.t === "swatch") return b.label || "Swatch";
  if (b.t === "tag" || b.t === "mark" || b.t === "seal") return b.text || b.t;
  if (b.t === "ticket") return b.t1 || "Ticket";
  return (b.t.charAt(0).toUpperCase() + b.t.slice(1));
}
function drawObjs(){
  const host = $("#objlist"); if (!host) return;
  $("#objs").hidden = !OBJS_ON || PRESENT;
  if (!OBJS_ON || PRESENT) return;
  const v = viewPages();
  host.innerHTML = v.map(({p, pi, ox}) => {
    const side = NB.bind === "spread" ? (ox ? "right" : "left") : "";
    const rows = p.blocks.slice().reverse().map(b => `
      <div class="orow2 ${SEL.has(b.id)?"sel":""} ${isLocked(b)?"lk":""}"
           draggable="${isLocked(b)?"false":"true"}" data-oid="${b.id}">
        <span class="ic">${OBJ_ICON[b.t] || "◻"}</span>
        <span class="nm">${esc(objName(b))}</span>
        <button class="lb" data-lock="${b.id}" title="${isLocked(b)?"Unlock":"Lock"}"
          aria-pressed="${isLocked(b)}">${isLocked(b)?"🔒":"🔓"}</button>
      </div>`).join("");
    return `<div class="ogroup"><div class="oh">${esc(p.name)}${side?` · ${side}`:""}
      <span>${p.blocks.length}</span></div>${rows || `<div class="oempty">nothing on this page yet</div>`}</div>`;
  }).join("");
}
let OBJS_ON = false;
function wireObjs(){
  const host = $("#objlist");
  host.onclick = e => {
    const lk = e.target.closest("[data-lock]");
    if (lk){ const b = byId(lk.dataset.lock); if (b) toggleLock([b]); return; }
    const r = e.target.closest("[data-oid]"); if (!r) return;
    const id = r.dataset.oid;
    if (e.shiftKey) SEL.has(id) ? SEL.delete(id) : SEL.add(id);
    else SEL = new Set([id]);
    drawSel(); drawTools(); drawObjs();
  };
  host.onmouseover = e => {
    const r = e.target.closest("[data-oid]"); if (!r) return;
    $$(".blk.lit2").forEach(n => n.classList.remove("lit2"));
    const el = $(`.blk[data-id="${r.dataset.oid}"]`); if (el) el.classList.add("lit2");
  };
  host.onmouseleave = () => $$(".blk.lit2").forEach(n => n.classList.remove("lit2"));
  let src = null;
  host.addEventListener("dragstart", e => {
    src = e.target.closest("[data-oid]"); if (src) src.classList.add("drag");
  });
  host.addEventListener("dragend", () => { if (src) src.classList.remove("drag"); src = null; });
  host.addEventListener("dragover", e => {
    e.preventDefault();
    const over = e.target.closest("[data-oid]");
    if (!over || !src || over === src || over.parentNode !== src.parentNode) return;
    const r = over.getBoundingClientRect();
    over.parentNode.insertBefore(src, (e.clientY - r.top)/r.height > .5 ? over.nextSibling : over);
  });
  host.addEventListener("drop", e => {
    e.preventDefault();
    const group = src && src.parentNode; if (!group) return;
    const ids = [...group.querySelectorAll("[data-oid]")].map(n => n.dataset.oid).reverse();
    const v = viewPages()[[...host.children].indexOf(group)];
    if (!v) return;
    snap();
    const map = new Map(v.p.blocks.map(b => [b.id, b]));
    v.p.blocks = ids.map(i => map.get(i)).filter(Boolean);
    dirty(); drawBlocks(); drawSel(); drawObjs();
  });
}

/* ═══════════════════════════════════════════════════════════════
   PART E — a cover is a KIND OF PAGE, export is a choice, and a
   lot more to stick on.
   ═══════════════════════════════════════════════════════════════ */

const isCover = p => !!(p && p.kind === "cover");
const COVER_COLORS = ["#3A4E4A","#5E3428","#2E3A52","#6B2E3A","#7A6A3E","#2A2620",
  "#8A6034","#4A5E68","#A0563E","#C9A97C"];
function coverMenu(anchor){
  const p = page(), cov = isCover(p), c = cvOf(p);
  popup(anchor, cov ? `<div class="gl">Material</div>
      ${Object.keys(COVERS).map(k => `<button data-cm="${k}"><span class="gicon">▦</span>${COVERS[k][0]}
        <span class="k">${c.material===k?"✓":""}</span></button>`).join("")}
      <hr><div class="gl">Colour</div>
      <div class="swrow2">${COVER_COLORS.map(x =>
        `<button data-cc="${x}" style="background:${x}" aria-pressed="${c.color===x}"
          aria-label="${x}"></button>`).join("")}</div>
      <hr><div class="gl">Blocking</div>
      ${[["label","Paper label"],["foil","Foil-blocked"],["blind","Blind-stamped"],["none","Bare"]].map(
        ([k,l]) => `<button data-cs="${k}"><span class="gicon">◇</span>${l}
        <span class="k">${c.style===k?"✓":""}</span></button>`).join("")}
      <hr>
      <button data-cx="title"><span class="gicon">T</span>Title${c.title?" — "+esc(c.title.slice(0,18)):"…"}</button>
      <button data-cx="sub"><span class="gicon">t</span>Second line${c.sub?" — "+esc(c.sub.slice(0,18)):"…"}</button>
      <button data-cx="foil"><span class="gicon">✦</span>Blocking colour…</button>
      <hr>
      <button data-cx="unmake"><span class="gicon">↩</span>Turn it back into a page</button>`
    : `<div class="gl">This page</div>
      <button data-cx="make"><span class="gicon">◆</span>Make it a cover</button>
      <hr><div class="gl">A cover is a page with a board instead of paper — it
      shows on its own, takes no page number, and can sit anywhere. Add as many
      as you like: front, back, or between sections.</div>`,
  async e => {
    const P = page();
    const m = e.target.closest("[data-cm]");
    if (m){ snap(); P.cover = Object.assign(cvOf(P), {material:m.dataset.cm});
      dirty(); drawBlocks(); drawSide(); closePop(); return; }
    const cc = e.target.closest("[data-cc]");
    if (cc){ snap(); P.cover = Object.assign(cvOf(P), {color:cc.dataset.cc});
      dirty(); drawBlocks(); drawSide(); closePop(); return; }
    const st = e.target.closest("[data-cs]");
    if (st){ snap(); P.cover = Object.assign(cvOf(P), {style:st.dataset.cs});
      dirty(); drawBlocks(); drawSide(); closePop(); return; }
    const x = e.target.closest("[data-cx]"); if (!x) return;
    const k = x.dataset.cx; closePop();
    if (k === "make"){
      snap(); P.kind = "cover";
      P.cover = Object.assign({}, COVER_DEF, {title:NB.title||""}, P.cover||{});
      if (/^Page /.test(P.name) || !P.name) P.name = "Cover";
      dirty(); drawAll(); fitPage(false);
      toast("It is a cover now. Material and blocking are under Cover ▾.", 4000);
      return;
    }
    if (k === "unmake"){
      snap(); delete P.kind;
      if (P.name === "Cover") P.name = "Page " + (PI + 1);
      dirty(); drawAll(); fitPage(false); return;
    }
    const ask = {title:["Cover title", "Blocked or printed on the front."],
      sub:["Second line", "A date, a volume number, a place."],
      foil:["Blocking colour", "A hex colour for the foil or the stamped lettering."]}[k];
    if (!ask) return;
    const v = await askText(ask[0], ask[1], k === "foil" ? c.foil : (c[k] || ""), "Set");
    if (v == null) return;
    snap(); P.cover = Object.assign(cvOf(P), {[k]: v.trim()});
    dirty(); drawBlocks(); drawSide();
  });
}
const COVER_DEF = {material:"cloth", color:"#3A4E4A", style:"label", foil:"#D9C08A", title:"", sub:""};
function cvOf(p){ return Object.assign({}, COVER_DEF, p.cover || {}); }
function coverCSS(p){
  const c = cvOf(p), m = COVERS[c.material] || COVERS.cloth;
  return m[1](esc(c.color));
}
function coverInner(p){
  const c = cvOf(p), foil = esc(c.foil), t = esc(c.title || ""), sub = esc(c.sub || "");
  if (!t && !sub) return "";
  if (c.style === "none") return "";
  if (c.style === "blind") return `<div class="cv-blind" style="color:${foil}">
    <span style="${textStyle({role:"title"})};color:inherit">${t}</span>
    ${sub ? `<span style="${textStyle({role:"label"})};color:inherit">${sub}</span>` : ""}</div>`;
  if (c.style === "foil") return `<div class="cv-foil" style="color:${foil}">
    <span style="${textStyle({role:"header"})};color:inherit;font-size:48px">${t}</span>
    ${sub ? `<span style="${textStyle({role:"label"})};color:inherit">${sub}</span>` : ""}</div>`;
  return `<div class="cv-label">
    <span style="${textStyle({role:"title"})};font-size:30px">${t}</span>
    ${sub ? `<span style="${textStyle({role:"label"})}">${sub}</span>` : ""}</div>`;
}
/* page numbers count leaves, not covers */
function pageNo(pi){
  const ps = sec().pages; let n = 0;
  for (let i = 0; i <= pi; i++) if (!isCover(ps[i])) n++;
  return isCover(ps[pi]) ? "" : String(n);
}

/* ── choosing what to export ─────────────────────────────────
   A notebook is rarely all one thing. Printing the whole of it
   when you wanted the Spring pages is a waste of paper and of
   the reader's patience.                                       */
function askPages(title, okLabel){
  const rows = [];
  NB.sections.forEach((s, si) => s.pages.forEach((p, pi) =>
    rows.push({si, pi, p, sname:s.name, scol:s.color})));
  let chosen = new Set(rows.map(r => r.si + ":" + r.pi));
  const body = () => NB.sections.map((s, si) => `
    <div class="xsec">
      <label class="xhead"><input type="checkbox" data-sec="${si}"
        ${s.pages.every((_,pi)=>chosen.has(si+":"+pi)) ? "checked" : ""}>
        <span class="tab" style="background:${esc(s.color)}"></span>${esc(s.name)}
        <span class="k">${s.pages.length}</span></label>
      <div class="xpages">${s.pages.map((p, pi) => `
        <label class="xrow"><input type="checkbox" data-pg="${si}:${pi}"
          ${chosen.has(si+":"+pi) ? "checked" : ""}>
          <span class="nm">${esc(p.name)}</span>
          ${isCover(p) ? `<span class="k">cover</span>` : `<span class="k">${p.blocks.length}</span>`}
        </label>`).join("")}</div>
    </div>`).join("");
  return openModal(`<h3>${esc(title)}</h3><div class="mb">
      <p class="note">Tick what you want. Covers count as sheets of their own.</p>
      <div class="xbar"><button class="btn" data-all="1">All</button>
        <button class="btn" data-all="0">None</button>
        <span class="eyebrow" id="xcount"></span></div>
      <div id="xlist">${body()}</div></div>
    <div class="mf"><button class="btn" data-x="0">Cancel</button>
    <button class="btn pri" data-x="1">${esc(okLabel || "Export")}</button></div>`,
  m => {
    const count = () => { const c = m.querySelector("#xcount");
      if (c) c.textContent = chosen.size + " of " + rows.length; };
    count();
    m.querySelector("#xlist").onchange = e => {
      const sc = e.target.dataset.sec, pg = e.target.dataset.pg;
      if (sc != null){
        NB.sections[+sc].pages.forEach((_, pi) => {
          const k = sc + ":" + pi;
          e.target.checked ? chosen.add(k) : chosen.delete(k);
        });
        m.querySelector("#xlist").innerHTML = body();
      } else if (pg != null){
        e.target.checked ? chosen.add(pg) : chosen.delete(pg);
        const si = pg.split(":")[0];
        const head = m.querySelector(`[data-sec="${si}"]`);
        if (head) head.checked = NB.sections[+si].pages.every((_,pi)=>chosen.has(si+":"+pi));
      }
      count();
    };
    m.onclick = e => {
      const a = e.target.closest("[data-all]");
      if (a){
        chosen = a.dataset.all === "1" ? new Set(rows.map(r => r.si+":"+r.pi)) : new Set();
        m.querySelector("#xlist").innerHTML = body(); count(); return;
      }
      const b = e.target.closest("[data-x]"); if (!b) return;
      if (b.dataset.x !== "1") return closeModal(null);
      if (!chosen.size) return toast("Nothing ticked.");
      closeModal(rows.filter(r => chosen.has(r.si+":"+r.pi)));
    };
  });
}

/* How a piece of border art answers being pulled longer:
   repeat  — the motif tiles, so a longer run is more of it
   stretch — one motif drawn to the box
   fixed   — keeps its shape, scales whole                     */
function skMode(key){
  const [c,n] = String(key||"").split("/");
  const e = SK[c] && SK[c][n];
  return (e && e[2]) || null;
}
function borderCSS(b){
  const [c,n] = String(b.key||"").split("/");
  const e = SK[c] && SK[c][n]; if (!e) return "";
  const mode = b.fit || skMode(b.key) || "repeat";
  const par = mode === "repeat" ? "" : ' preserveAspectRatio="none"';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"${par}>` +
    `<g stroke-linejoin="round" stroke-linecap="round">${e[1]}</g></svg>`;
  const size = mode === "repeat" ? "auto 100%" : mode === "fixed" ? "contain" : "100% 100%";
  const rep = mode === "repeat" ? "repeat-x" : "no-repeat";
  return `background-image:url('${SVG_URI(svg)}');background-size:${size};` +
    `background-repeat:${rep};background-position:${mode === "fixed" ? "center" : "left center"}`;
}

function closeModal(v){
  $("#scrim").classList.remove("on"); $("#modal").innerHTML = "";

function openModal(html, wire){
  return new Promise(done => {

    if (wire) wire($("#modal"));

}

  m => {

/* ── torn edges, seeded per block so they never dance ───────── */
function torn(id, amp){
  const r = rng(hash(id)), a = amp || 2.2, pts = [], N = 13;
  const push = (x,y) => pts.push(`${x.toFixed(2)}% ${y.toFixed(2)}%`);
  for (let i=0;i<=N;i++) push(i/N*100, (r()*a));
  for (let i=1;i<=N;i++) push(100 - (r()*a), i/N*100);
  for (let i=N-1;i>=0;i--) push(i/N*100, 100 - (r()*a));
  for (let i=N-1;i>=1;i--) push(r()*a, i/N*100);
  return `polygon(${pts.join(",")})`;
}

function miniHTML(p){
  const [pw,ph] = PAGE_SIZES[p.size] || PAGE_SIZES.land;

    const x = clamp(b.x/pw,0,1)*100, y = clamp(b.y/ph,0,1)*100;

function inkPath(b){
  const p = b.pts || [];
  if (p.length < 2) return "";
  let d = `M ${p[0][0]} ${p[0][1]}`;
  for (let i=1;i<p.length-1;i++){
    const mx = (p[i][0]+p[i+1][0])/2, my = (p[i][1]+p[i+1][1])/2;
    d += ` Q ${p[i][0]} ${p[i][1]} ${mx} ${my}`;
  }
  const l = p[p.length-1]; d += ` L ${l[0]} ${l[1]}`;
  return d;
}

      return `<div class="b-ribbon" style="${tapeCSS(b, esc(b.color||RIBBON_COLORS[0]))}"></div>`;
    case "date":   return dateHTML(b);
    case "doodle":
      return `<div class="b-doodle">${doodleSVG(b.key, b.color, b.width)}</div>`;
    case "clip":   return clipHTML(b);
    case "seal":   return sealHTML(b);
    case "env":    return envHTML(b);
    case "lace":   return laceHTML(b);
    case "libcard":return cardHTML(b);
    case "post":   return postHTML(b);
    case "check":
      return `<div class="b-check" style="font-size:${b.size||16}px">${
        (b.items||[]).map((it,i) => `<div class="ci ${it[0]?"on":""}">
          <span class="bx" data-ck="${i}"></span><span>${esc(it[1])}</span></div>`).join("")}</div>`;
    case "sticker":
      /* border art is a background so it can tile; everything else is
         an inline drawing so it can carry its die-cut halo */
      if (skMode(b.key)) return `<div class="b-bord" style="position:absolute;inset:0;${borderCSS(b)}"></div>`;
      return `<div class="b-sticker ${b.die===false?"flat":"die"}"
        style="position:absolute;inset:0">${skSVG(b.key)}</div>`;
    case "time":   return timeHTML(b);
    case "month":  return monthHTML(b);
    case "track":  return trackHTML(b);
    case "mood":   return moodHTML(b);
    case "rate":   return rateHTML(b);
    case "quote":  return quoteHTML(b);
    case "mark":   return markHTML(b);
    case "ink":
      return `<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"
        viewBox="0 0 ${b.vw||100} ${b.vh||100}" preserveAspectRatio="none">
        <path d="${inkPath(b)}" fill="none" stroke="${esc(b.color||"#1E1B16")}"
        stroke-width="${b.width||3}" stroke-linecap="round" stroke-linejoin="round"
        ${b.kind==="marker" ? 'opacity="0.42"' : ""}/></svg>`;
  }
  return "";
}

function drawSel(){
  const s = $("#sel"), box = selBox();
  if (!box || PRESENT || TOOL !== "select"){ s.hidden = true; return; }

  s.style.cssText = `left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px;
    transform:rotate(${box.rot}deg)`;
  const r = s.querySelector(".rot");
  r.style.left = "50%"; r.style.top = (-26/W.z) + "px";
  drawObjs();

function camApply(){
  $("#world").style.transform = `translate(${W.x}px,${W.y}px) scale(${W.z})`;
  document.documentElement.style.setProperty("--iz", (1/W.z).toFixed(4));
  $("#z-lvl").textContent = Math.round(W.z*100) + "%";
  drawRulers();
}
const toWorld = (cx,cy) => {
  const r = $("#canvas").getBoundingClientRect();
  return {x:(cx-r.left-W.x)/W.z, y:(cy-r.top-W.y)/W.z};
};

function drawTools(){
  const t = $("#tools");
  if (RO){
    t.innerHTML = `<span class="lbl">Read only</span><span class="sep"></span>
      <button class="btn ghost" id="t-export">Export JSON</button>
      <button class="btn ghost" id="t-pdf">⎙ Print / PDF</button>`;
    $("#t-export").onclick = exportJSON;

  if (TOOL !== "select"){ t.innerHTML = penHTML(); wirePen(); return; }
  const arr = selArr();
  t.innerHTML = arr.length ? propsHTML(arr) : insertHTML();

function penHTML(){
  return `<span class="lbl">${TOOL === "marker" ? "Marker" : "Pen"}</span>
    <div class="seg" id="pk">
      <button data-k="pen" aria-pressed="${TOOL==="pen"}">Pen</button>

    ${INK_COLORS.map(c=>`<button class="ico" data-pc="${c}" style="background:${c};
      border:2px solid ${PEN.color===c?"var(--accent)":"transparent"}" aria-label="${c}"></button>`).join("")}
    <span class="sep"></span><span class="lbl">Width</span>
    <input type="range" min="1" max="24" id="pw" value="${PEN.width}">
    <span class="sep"></span>
    <button class="btn pri" id="p-done">Done drawing <span class="k">Esc</span></button>
    <span class="lbl">draw on the page — each stroke is its own object</span>`;
}
function wirePen(){
  const t = $("#tools");
  t.onclick = e => {
    const k = e.target.closest("#pk [data-k]");
    if (k){ TOOL = k.dataset.k; PEN.kind = TOOL; drawTools(); return; }
    const c = e.target.closest("[data-pc]");
    if (c){ PEN.color = c.dataset.pc; drawTools(); return; }
    if (e.target.closest("#p-done")) setTool("select");
  };
  t.oninput = e => { if (e.target.id === "pw") PEN.width = +e.target.value; };
}
function setTool(t){
  TOOL = t; PEN.kind = t === "marker" ? "marker" : "pen";
  $("#canvas").classList.toggle("inking", t !== "select");
  if (t !== "select"){ SEL.clear(); }
  drawSel(); drawTools();
}

      <input type="range" min="-30" max="30" step="0.5" data-p="rot" value="${b.rot||0}">`;
  }
  s += `<span class="sep"></span>
    <button class="ico" data-act="front" title="Bring to front">⤒</button>
    <button class="ico" data-act="back" title="Send to back">⤓</button>
    ${many ? `<span class="sep"></span>
      <button class="btn ghost" data-act="alignL">Align left</button>
      <button class="btn ghost" data-act="alignC">Centre</button>
      <button class="btn ghost" data-act="distV">Space out</button>` : ""}
    <span class="sep"></span>
    <button class="ico" data-act="lock" title="Lock (⌘L)"
      aria-pressed="${arr.every(b=>b.lock)}">${arr.every(b=>b.lock) ? "🔒" : "🔓"}</button>

function wireTools(arr){
  const t = $("#tools");
  t.onclick = e => {
    const ins = e.target.closest("[data-ins]"); if (ins) return insert(ins.dataset.ins);
    const mk = e.target.closest("[data-mark]");
    if (mk){ snap(); arr.forEach(b => b.text = mk.dataset.mark); dirty(); drawBlocks(); drawTools(); return; }
    const sw = e.target.closest("[data-swatch]");
    if (sw){ const k = sw.dataset.swk || "color";
      snap(); arr.forEach(b => b[k] = sw.dataset.swatch); dirty(); drawBlocks(); drawTools(); return; }
    const seg = e.target.closest(".seg [data-v]");
    if (seg){ const p = seg.closest("[data-p]").dataset.p;
      snap(); arr.forEach(b => b[p] = seg.dataset.v); dirty(); drawBlocks(); drawTools(); return; }
    const act = e.target.closest("[data-act]"); if (act) return doAct(act.dataset.act, arr);
    if (e.target.closest("#t-pen")) return setTool("pen");
    if (e.target.closest("#t-eph")) return kindMenu(e.target.closest("#t-eph"), EPHEMERA, "Ephemera");
    if (e.target.closest("#t-jour")) return kindMenu(e.target.closest("#t-jour"), JOURNAL, "Journal");
    if (e.target.closest("#t-stick")) return stickerMenu(e.target.closest("#t-stick"));
    if (e.target.closest("#t-sten")) return stenMenu(e.target.closest("#t-sten"));
    if (e.target.closest("#t-book")) return bookMenu(e.target.closest("#t-book"));
    if (e.target.closest("#t-doodle")) return doodleMenu(e.target.closest("#t-doodle"), null);
    if (e.target.closest("#t-layouts")) return layoutMenu(e.target.closest("#t-layouts"));
    if (e.target.closest("#t-cover")) return coverMenu(e.target.closest("#t-cover"));
    if (e.target.closest("#t-tmpl")) return tmplMenu(e.target.closest("#t-tmpl"));
    if (e.target.closest("#t-rename")) return renamePage();
    if (e.target.closest("#t-duppage")) return dupPage();
    if (e.target.closest("#t-delpage")) return delPage();
  };
  const live = e => {
    const p = e.target.dataset.p; if (!p) return;
    const v = (e.target.type === "number" || e.target.type === "range") ? +e.target.value : e.target.value;
    arr.forEach(b => {
      b[p] = v;
      if (p === "preset" || p === "size" || p === "font" || p === "caps" || p === "role") b.h = 0;
      if (p === "role"){ delete b.track; delete b.caps; delete b.ital; delete b.font;
        delete b.weight; delete b.color; delete b.size; }
      if (p === "trackx"){ b.track = v/100; delete b.trackx; b.h = 0; }
      if (p === "fmt" && v !== "custom") delete b.text;
      /* a month is picked whole: a part-typed year is not a year */
      if (p === "ym"){
        const mt = /^(\d{4})-(\d{2})$/.exec(String(v));
        if (mt){ b.y = +mt[1]; b.m = +mt[2] - 1; }
        delete b.ym;
      }
      if (p === "kind" && b.t === "shape") b.h = b.kind === "rule" ? 0 : (b.h || 120);
    });
    dirty(); drawBlocks(); drawSel();
    if (["kind","frame","fill","fmt","style","role"].includes(p)) drawTools();
  };
  t.oninput = e => { if (e.target.tagName !== "SELECT") live(e); };
  t.onchange = e => {
    if (e.target.id === "t-size"){ snap(); page().size = e.target.value; dirty(); drawAll(); fitPage(true); return; }
    if (e.target.id === "t-paper"){ snap(); page().paper = e.target.value; dirty(); drawAll(); return; }
    if (e.target.tagName === "SELECT") live(e);
  };
  t.onfocusin = e => { if (e.target.dataset.p) snap(); };
  const sz = $("#t-size"); if (sz) sz.value = page().size || "land";
  const pp = $("#t-paper"); if (pp) pp.value = page().paper || "plain";
}

function doAct(a, arr){
  const bs = blocks();
  if (a === "del"){ snap(); viewPages().forEach(v => v.p.blocks = v.p.blocks.filter(b => !SEL.has(b.id)));
    SEL.clear(); }
  else if (a === "dup"){
    snap();
    const copies = arr.map(b => {
      const c = Object.assign({}, b, {id:uid(), x:b.x+24, y:b.y+24});
      const bl = blobFor(b.id); if (bl) BLOBS.set(c.id, bl);
      return c;
    });
    copies.forEach((c,i) => pageOfBlock(arr[i].id).p.blocks.push(c));
    SEL = new Set(copies.map(c => c.id));
  }
  else if (a === "front"){ snap(); arr.forEach(b => { const L = pageOfBlock(b.id).p.blocks;
    L.splice(L.indexOf(b),1); L.push(b); }); }
  else if (a === "back"){ snap(); arr.slice().reverse().forEach(b => { const L = pageOfBlock(b.id).p.blocks;
    L.splice(L.indexOf(b),1); L.unshift(b); }); }
  else if (a === "alignL"){ snap(); const x = Math.min(...arr.map(b=>b.x)); arr.forEach(b=>b.x=x); }
  else if (a === "alignC"){ snap(); const c = arr.reduce((s,b)=>s+b.x+b.w/2,0)/arr.length;
    arr.forEach(b=>b.x=Math.round(c-b.w/2)); }
  else if (a === "distV"){ snap(); const s = arr.slice().sort((p,q)=>p.y-q.y);
    const top = s[0].y, gap = (s[s.length-1].y-top)/(s.length-1);
    s.forEach((b,i)=>b.y=Math.round(top+gap*i)); }
  else if (a === "rip"){ snap(); arr.forEach(b => b.rip = b.rip === false); }
  else if (a === "lock"){ toggleLock(arr); return; }
  else if (a === "caps"){ snap(); arr.forEach(b => { b.caps = b.caps ? 0 : 1; b.h = 0; }); }
  else if (a === "ital"){ snap(); arr.forEach(b => { b.ital = b.ital ? 0 : 1; b.h = 0; }); }
  else if (a === "type"){ kitMenu($("#tools"), arr); return; }
  else if (a === "pickDoodle"){ doodleMenu($("#tools"), arr[0]); return; }
  else if (a === "die"){ snap(); arr.forEach(b => b.die = b.die === false); }
  else if (a === "pickSticker"){ stickerSwap(arr[0]); return; }
  else if (a === "trackrows") return trackRows(arr[0]);
  else if (a === "replace"){ PICK_FOR = arr[0].id; $("#picker").click(); return; }
  else if (a === "specedit") return specEditor(arr[0]);
  else if (a === "editlist") return listEditor(arr[0]);
  else if (a === "setToday"){ const t = today(); snap(); arr[0].text = t.stamp; arr[0].sub = t.wd; }
  dirty(); drawBlocks(); drawSel(); drawTools(); drawSide();
}

/* ════ CANVAS INTERACTION ═══════════════════════════════════ */
let MODE = null, START = null, ORIG = null, SPACE = false, STROKE = null;
const SNAP_PX = 6;

$("#canvas").addEventListener("pointerdown", e => {
  if (PRESENT) return;
  if (e.target.closest("#hud")) return;
  const cv = $("#canvas");
  cv.setPointerCapture(e.pointerId);
  START = {sx:e.clientX, sy:e.clientY, w:toWorld(e.clientX, e.clientY)};

  if (SPACE || e.button === 1){ MODE = "pan"; ORIG = {...W}; cv.classList.add("pan"); return; }

  if (TOOL !== "select" && !RO){
    MODE = "ink"; STROKE = [[START.w.x, START.w.y]];
    $("#wet").innerHTML = `<path id="wetp" fill="none" stroke="${PEN.color}" stroke-width="${PEN.width}"
      stroke-linecap="round" stroke-linejoin="round" ${TOOL==="marker"?'opacity="0.42"':""}/>`;
    return;
  }

  /* a tick, a ringed day, a filled square — a click on the page
     itself, not a selection */
  const bit = e.target.closest(LIVE_BITS);
  if (bit && !RO){
    const host = e.target.closest(".blk"), b = host && byId(host.dataset.id);
    if (b){
      const d = bit.dataset;
      snap();
      if (d.ck != null && b.items) b.items[+d.ck][0] = b.items[+d.ck][0] ? 0 : 1;
      else if (d.day != null){
        const set = new Set(b.on || []); const v = +d.day;
        set.has(v) ? set.delete(v) : set.add(v); b.on = [...set].sort((x,y)=>x-y);
      } else if (d.cell != null){
        const [r,c] = d.cell.split(",").map(Number);
        const has = (b.on||[]).some(p => p[0]===r && p[1]===c);
        b.on = has ? b.on.filter(p => !(p[0]===r && p[1]===c)) : (b.on||[]).concat([[r,c]]);
      } else if (d.pick != null) b.pick = b.pick === +d.pick ? -1 : +d.pick;
      else if (d.star != null)   b.v = b.v === +d.star + 1 ? +d.star : +d.star + 1;
      dirty(); drawBlocks(); MODE = null; return;
    }
  }

  const handle = e.target.closest("#sel .h");
  const blkEl = e.target.closest(".blk");
  if (handle && !RO){
    MODE = handle.dataset.h === "rot" ? "rot" : "size";
    ORIG = {h:handle.dataset.h, blocks:selArr().map(b=>({...b, ox:oxOf(b.id)})), box:selBox()};
    snap(); return;
  }
  if (blkEl && !RO){
    const id = blkEl.dataset.id;
    if (blkEl.dataset.edit === "1") return;
    if (isLocked(byId(id))){                 /* a locked piece is scenery */
      if (!e.shiftKey){ SEL.clear(); drawSel(); drawTools(); }
      MODE = "marquee"; return;
    }
    if (e.shiftKey){ SEL.has(id) ? SEL.delete(id) : SEL.add(id); drawSel(); drawTools(); MODE = null; return; }
    if (!SEL.has(id)){ SEL = new Set([id]); drawSel(); drawTools(); }
    MODE = "maybe"; ORIG = {blocks:selArr().map(b=>({...b, ox:oxOf(b.id)}))};
    return;
  }
  if (!e.shiftKey && !RO){ SEL.clear(); drawSel(); drawTools(); }
  MODE = RO ? "pan" : "marquee";
  if (MODE === "pan"){ ORIG = {...W}; cv.classList.add("pan"); }
});

$("#canvas").addEventListener("pointermove", e => {
  moveRulerMark(e.clientX, e.clientY);
  if (!MODE) return;
  const dx = e.clientX - START.sx, dy = e.clientY - START.sy;

  if (MODE === "pan"){ W.x = ORIG.x + dx; W.y = ORIG.y + dy; camApply(); return; }

  if (MODE === "ink"){
    const p = toWorld(e.clientX, e.clientY), last = STROKE[STROKE.length-1];
    if (Math.hypot(p.x-last[0], p.y-last[1]) < 2/W.z) return;
    STROKE.push([p.x, p.y]);
    const wp = $("#wetp");
    if (wp) wp.setAttribute("d", inkPath({pts:STROKE}));
    return;
  }

  if (MODE === "maybe"){ if (Math.hypot(dx,dy) < 4) return; MODE = "move"; snap(); }

  if (MODE === "move"){
    const g = snapDelta(dx/W.z, dy/W.z);
    ORIG.blocks.forEach(o => {
      const b = byId(o.id); if (!b) return;
      b.x = Math.round(o.x + g.x); b.y = Math.round(o.y + g.y);
      const el = $(`.blk[data-id="${b.id}"]`);
      if (el){ el.style.left = b.x+"px"; el.style.top = b.y+"px"; }
    });
    drawSel(); drawGuides(g.gx, g.gy); return;
  }

  if (MODE === "size"){
    const h = ORIG.h, th = rad(ORIG.box.rot);
    const lx =  (dx/W.z)*Math.cos(th) + (dy/W.z)*Math.sin(th);
    const ly = -(dx/W.z)*Math.sin(th) + (dy/W.z)*Math.cos(th);
    const west = h.includes("w"), east = h.includes("e");
    const north = h.startsWith("n"), south = h.startsWith("s");
    ORIG.blocks.forEach(o => {
      const b = byId(o.id); if (!b) return;
      let x=o.x, y=o.y, w=o.w, hh=o.h||30;
      if (east) w = Math.max(24, o.w + lx);
      if (west){ w = Math.max(24, o.w - lx); x = o.x + (o.w - w); }
      if (south) hh = Math.max(16, (o.h||30) + ly);
      if (north){ hh = Math.max(16, (o.h||30) - ly); y = o.y + ((o.h||30) - hh); }
      if (e.shiftKey && (o.h||0)){
        const k = o.w/(o.h||30);
        if (east||west) hh = Math.max(16, w/k); else w = Math.max(24, hh*k);
      }
      b.x=Math.round(x); b.y=Math.round(y); b.w=Math.round(w); b.h=Math.round(hh);
      const el = $(`.blk[data-id="${b.id}"]`);
      if (el){ el.style.left=b.x+"px"; el.style.top=b.y+"px";
               el.style.width=b.w+"px"; el.style.height=b.h+"px"; }
    });
    drawSel(); return;
  }

  if (MODE === "rot"){
    const box = ORIG.box, r = $("#canvas").getBoundingClientRect();
    const cx = r.left + W.x + (box.x+box.w/2)*W.z, cy = r.top + W.y + (box.y+box.h/2)*W.z;
    let a = Math.atan2(e.clientY-cy, e.clientX-cx)*180/Math.PI + 90;
    if (e.shiftKey) a = Math.round(a/15)*15;
    ORIG.blocks.forEach(o => {
      const b = byId(o.id); if (!b) return;
      b.rot = Math.round(a*10)/10;
      const el = $(`.blk[data-id="${b.id}"]`); if (el) el.style.transform = `rotate(${b.rot}deg)`;
    });
    drawSel(); return;
  }

  if (MODE === "marquee"){
    let m = $("#marquee");
    if (!m){ m = document.createElement("div"); m.id = "marquee"; $("#world").appendChild(m); }
    const a = START.w, b = toWorld(e.clientX, e.clientY);
    const x = Math.min(a.x,b.x), y = Math.min(a.y,b.y);
    const w = Math.abs(b.x-a.x), hgt = Math.abs(b.y-a.y);
    m.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${hgt}px`;
    SEL = new Set(viewBlocks().filter(q => { if (isLocked(q)) return false; const o = oxOf(q.id);
      return q.x+o < x+w && q.x+o+q.w > x && q.y < y+hgt && q.y+(q.h||30) > y; }).map(q=>q.id));
    drawSel();
  }
});


$("#canvas").addEventListener("pointerup", () => {
  $("#canvas").classList.remove("pan");
  const m = $("#marquee"); if (m) m.remove();
  $("#guides").innerHTML = "";
  if (MODE === "ink"){

    if (STROKE && STROKE.length > 1){

      const pad = PEN.width + 4;
      const x0 = Math.min(...xs)-pad, y0 = Math.min(...ys)-pad;
      const w = Math.max(...xs)-Math.min(...xs)+pad*2, h = Math.max(...ys)-Math.min(...ys)+pad*2;
      const b = blk("ink", Math.round(x0), Math.round(y0), Math.round(w), Math.round(h), {

        vw: Math.round(w), vh: Math.round(h),

      });
      snap(); putBlocks([b], {x:x0, y:y0}); dirty(); drawBlocks(); drawSide();
    }
    STROKE = null; MODE = null; return;
  }
  if (MODE === "move"){ rehomeBlocks(selArr()); }
  if (MODE === "move" || MODE === "size" || MODE === "rot"){ dirty(); drawBlocks(); drawSel(); drawSide(); }
  if (MODE === "marquee") drawTools();

});

$("#canvas").addEventListener("wheel", e => {
  e.preventDefault();
  const r = $("#canvas").getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  if (e.ctrlKey || e.metaKey){                     /* a trackpad pinch arrives with ctrlKey */
    const wx = (mx-W.x)/W.z, wy = (my-W.y)/W.z;
    W.z = clamp(W.z * Math.exp(-e.deltaY*0.01), .08, 4);
    W.x = mx - wx*W.z; W.y = my - wy*W.z;
  } else {
    W.x -= e.shiftKey ? e.deltaY : e.deltaX;
    W.y -= e.shiftKey ? 0 : e.deltaY;
  }
  camApply();
}, {passive:false});

/* ── text editing ──────────────────────────────────────────── */
function editText(id){
  const b = byId(id), el = $(`.blk[data-id="${id}"]`);
  if (!b || !el) return;
  const t = el.querySelector(b.t === "note" ? ".b-note" : ".b-text");
  if (!t) return;
  el.dataset.edit = "1";
  t.contentEditable = "true"; t.spellcheck = true; t.focus();
  const r = document.createRange(); r.selectNodeContents(t);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const finish = () => {
    t.contentEditable = "false"; delete el.dataset.edit;
    const v = t.innerText.replace(/\u00A0/g," ").replace(/\n{3,}/g,"\n\n").trim();
    if (v !== (b.text||"")){ snap(); b.text = v; dirty(); }
    if (b.t === "text") b.h = 0;
    if (!v && b.t === "text"){ const pp = pageOfBlock(b.id).p;
      pp.blocks = pp.blocks.filter(q => q.id !== b.id); SEL.delete(b.id); }
    drawBlocks(); drawSel(); drawTools(); drawSide();
  };
  t.addEventListener("blur", finish, {once:true});
  t.addEventListener("keydown", ev => {
    ev.stopPropagation();
    if (ev.key === "Escape"){ ev.preventDefault(); t.blur(); }
    if (ev.key === "Enter" && (ev.metaKey||ev.ctrlKey)){ ev.preventDefault(); t.blur(); }
  });
}

/* ── keyboard ──────────────────────────────────────────────── */
addEventListener("keydown", e => {
  if ($("#scrim").classList.contains("on")) return;
  const typing = e.target.isContentEditable || /input|textarea|select/i.test(e.target.tagName);
  if (e.key === " " && !typing && !PRESENT){ SPACE = true; $("#canvas").classList.add("spacing"); }
  if (PRESENT){
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); pgo(1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); pgo(-1); }
    if (e.key === "Escape") setPresent(false);
    return;
  }
  if (typing) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "s"){ e.preventDefault(); save(); return; }
  if (mod && e.key.toLowerCase() === "d"){ e.preventDefault(); if (SEL.size) doAct("dup", selArr()); return; }
  if (mod && e.key.toLowerCase() === "a"){ e.preventDefault();
    SEL = new Set(viewBlocks().filter(b => !isLocked(b)).map(b=>b.id)); drawSel(); drawTools(); return; }
  if (mod && e.key.toLowerCase() === "l"){ e.preventDefault(); if (SEL.size) toggleLock(selArr()); return; }
  if (mod) return;
  if (e.key === "Escape"){ if (TOOL !== "select") setTool("select"); else { SEL.clear(); drawSel(); drawTools(); } return; }
  if ((e.key === "Backspace" || e.key === "Delete") && SEL.size){ e.preventDefault(); doAct("del", selArr()); return; }
  if (e.key.startsWith("Arrow") && SEL.size){
    e.preventDefault(); snap();
    const d = e.shiftKey ? 10 : 1;
    selArr().forEach(b => {
      if (e.key === "ArrowLeft") b.x -= d; if (e.key === "ArrowRight") b.x += d;
      if (e.key === "ArrowUp") b.y -= d;   if (e.key === "ArrowDown") b.y += d;
    });
    dirty(); drawBlocks(); drawSel(); return;
  }
  const k = e.key.toLowerCase();
  if (k === "p") setTool(TOOL === "select" ? "pen" : "select");
  if (k === "t") insert("text");
  if (k === "n") insert("note");
  if (k === "v") setTool("select");
  if (k === "g"){ NB.stenOn = NB.stenOn === false; dirty(); drawSten();
    toast(NB.stenOn === false ? "Stencil hidden." : "Stencil shown."); }
  if (k === "r"){ NB.rulers = !NB.rulers; dirty(); drawRulers(); }
}, false);
addEventListener("keyup", e => {
  if (e.key === " "){ SPACE = false; $("#canvas").classList.remove("spacing"); }
});

/* ════ PHOTOGRAPHS ══════════════════════════════════════════ */
const MAX_EDGE = 1800, Q = 0.82;
let PICK_FOR = null;
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, MAX_EDGE/Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width*k), h = Math.round(bmp.height*k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  return {blob: await new Promise(r => c.toBlob(r,"image/jpeg",Q)), w, h};
}
async function setPhoto(b, file){
  try {
    const {blob,w,h} = await shrink(file);
    if (b.src && b.src.startsWith("blob:")) URL.revokeObjectURL(b.src);
    snap(); b.src = URL.createObjectURL(blob); b.natW = w; b.natH = h;
    BLOBS.set(b.id, blob); idbPut(b.id, blob); dirty(); drawBlocks(); drawSide();
  } catch(_){ toast("That file could not be read as an image."); }
}
async function dropFiles(files, at){
  const imgs = [...files].filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  const empties = viewBlocks().filter(b => (b.t === "photo" || b.t === "stamp" || b.t === "post") && !b.src);
  let n = 0, ox = 0;
  for (const f of imgs){
    if (empties.length){ await setPhoto(empties.shift(), f); n++; continue; }
    try {
      const {blob,w,h} = await shrink(f);
      const ww = 320, hh = Math.round(ww*h/w);
      const b = blk("photo", Math.round(at.x-ww/2+ox), Math.round(at.y-hh/2+ox), ww, hh,
        {src:URL.createObjectURL(blob), natW:w, natH:h, fit:"cover", frame:"none", radius:2, caption:""});
      snap(); putBlocks([b], at); BLOBS.set(b.id, blob); idbPut(b.id, blob); ox += 26; n++;
    } catch(_){}
  }
  if (n){ dirty(); drawBlocks(); drawSel(); drawSide(); toast(`${n} photograph${n>1?"s":""} placed.`); }
}
$("#picker").onchange = async e => {
  const f = e.target.files;
  if (PICK_FOR && f.length === 1){ const b = byId(PICK_FOR); if (b) await setPhoto(b, f[0]); }
  else await dropFiles(f, centreOfView());
  PICK_FOR = null; e.target.value = "";
};
$("#canvas").addEventListener("dragover", e => e.preventDefault());
$("#canvas").addEventListener("drop", e => {
  e.preventDefault(); if (RO || PRESENT) return;
  if (e.dataTransfer.files.length) dropFiles(e.dataTransfer.files, toWorld(e.clientX, e.clientY));

addEventListener("paste", e => {

});

/* pages are re-ordered by dragging them in the rail */
(function pageDnD(){
  const list = $("#pagelist"); let src = null;
  list.addEventListener("dragstart", e => {
    src = e.target.closest('.prow[draggable="true"]');
    if (src) { src.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; }
  });
  list.addEventListener("dragend", () => { if (src) src.classList.remove("drag"); src = null; });
  list.addEventListener("dragover", e => {
    if (!src) return;
    e.preventDefault();
    const over = e.target.closest('.prow[draggable="true"]');
    if (!over || over === src) return;
    const r = over.getBoundingClientRect();
    list.insertBefore(src, (e.clientY - r.top)/r.height > .5 ? over.nextSibling : over);
  });
  list.addEventListener("drop", e => {
    if (!src) return;
    e.preventDefault();
    const order = [...list.querySelectorAll('.prow[draggable="true"]')].map(n => +n.dataset.pi);
    const keep = sec().pages[PI];
    snap();
    sec().pages = order.map(i => sec().pages[i]).filter(Boolean);
    PI = Math.max(0, sec().pages.indexOf(keep));
    dirty(); drawAll();
    toast("Pages re-ordered.");
  });
})();

function allPages(){

function setPresent(on){
  PRESENT = on;
  if (on) setTool("select");
  document.body.classList.toggle("present", on);
  $("#canvas").classList.toggle("present", on);
  if (on) SEL.clear();
  drawSel(); drawSten(); drawRulers(); drawBlocks(); pinfo(); fitPage(false);
  $("#b-present").textContent = on ? "Exit" : (NB.bind === "spread" ? "▥ Read" : "▶ Present");
}
function pinfo(){
  const all = allPages(), i = all.findIndex(a => a.si===SI && a.pi===PI);
  $("#p-now").textContent = (i+1) + " / " + all.length;
  $("#pbar").classList.toggle("book", NB.bind === "spread");
  $("#ptitle").textContent = sec().name + " — " + page().name;
}
function pgo(d){
  const all = allPages();
  let i = all.findIndex(a => a.si===SI && a.pi===PI);
  /* in a bound book you turn a leaf, which is two pages */
  if (NB.bind === "spread" && !isCover(page()) && all[i] && all[i].si === SI){
    const step = d > 0 ? 2 : -2;
    let j = i + step;
    if (j < 0 || j >= all.length){
      j = d > 0 ? Math.min(i + 1, all.length - 1) : Math.max(i - 1, 0);
      if (j === i) return toast(d>0 ? "The last page." : "The first page.");
    }
    if (PRESENT) flip(d);
    SI = all[j].si; PI = all[j].pi;
    drawSten(); drawBlocks(); drawSide(); pinfo(); fitPage(true);
    return;
  }
  i += d;
  if (i < 0 || i >= all.length) return toast(d>0 ? "The last page." : "The first page.");
  SI = all[i].si; PI = all[i].pi;
  drawSten(); drawBlocks(); drawSide(); pinfo(); fitPage(true);
}

function zstep(k){
  const c = $("#canvas").getBoundingClientRect();
  const wx = (c.width/2-W.x)/W.z, wy = (c.height/2-W.y)/W.z;
  W.z = clamp(W.z*k, .08, 4);
  W.x = c.width/2 - wx*W.z; W.y = c.height/2 - wy*W.z;

}

/* ════ SAVE ═════════════════════════════════════════════════ */
function serialise(){
  const out = JSON.parse(JSON.stringify({title:NB.title, version:3, sections:NB.sections,
    stencils:NB.stencils||[], stenOn:NB.stenOn!==false, stenSnap:NB.stenSnap!==false, rulers:!!NB.rulers,
    bind:NB.bind||"single", gutter:gutterW(), spine:NB.spine||"stitch",
    gutterShade:NB.gutterShade!==false, nums:NB.nums!==false, anim:NB.anim!==false,
    kit:NB.kit||"Bench", templates:NB.templates||[], daily:NB.daily||null}));
  const pl = out.sections.flatMap(s => s.pages);
  for (const p of pl) for (const b of p.blocks){
    if (!b.src) continue;
    if (blobFor(b.id)) b.src = "media/" + b.id + ".jpg";      /* ours, published or about to be */
    else if (String(b.src).startsWith("blob:")) b.src = null;  /* a dead URL from a past session */
    /* anything else is already a media/ path from a previous load — leave it */
  }
  return out;
}
let FILES_OK = true, SAVE_ERR = null, SAVED_BYTES = 0;

const seedRe = () => /<script id="seed" type="application\/json">[\s\S]*?<\/script>/;
const dataURL = blob => new Promise((ok,no) => {
  const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = no; f.readAsDataURL(blob);
});

/* The files form writes only what changed and leaves this view running.
   Not every host offers it, so there is a whole-page fallback below. */
async function saveFiles(){
  const files = {"data/notebook.json":{content:JSON.stringify(serialise()), contentType:"application/json"}};
  SAVED_BYTES = 0;
  for (const [id,blob] of BLOBS){ files["media/"+id+".jpg"] = blob; SAVED_BYTES += blob.size; }
  await CAP.publish(files);
}

/* Fallback: rewrite this page with the notebook baked into it. Photographs
   go in as data URIs, because there is no media/ directory in this mode. */
async function serialiseInline(){
  const out = serialise();
  const pp = out.sections.flatMap(s => s.pages);
  for (const p of pp) for (const b of p.blocks){
    if (!b.src) continue;
    const bl = blobFor(b.id);
    if (bl){ b.src = await dataURL(bl); continue; }
    if (String(b.src).startsWith("data:")) continue;
    try {                                   /* an earlier media/ file — pull it back in */
      const r = await fetch(b.src, {cache:"force-cache"});
      b.src = r.ok ? await dataURL(await r.blob()) : null;
    } catch(_){ b.src = null; }
  }
  return out;
}
async function pageSource(){
  try {
    const r = await fetch(location.href, {cache:"no-store"});
    if (!r.ok) return null;
    const t = await r.text();
    /* The seed block is the real proof this is our own page. A doctype
        is NOT: the artifact host adds one at publish time, so the copy
        in the repo has none — which is what made a standalone export
        fail with "could not read its own source". */
    if (!seedRe().test(t)) return null;
    return /^\s*<!doctype/i.test(t) ? t : "<!doctype html>\n" + t;
  } catch(_){ return null; }
}
async function saveWholePage(){
  const src = await pageSource();
  if (!src) throw {code:"no_source", message:"this page's own source could not be read"};
  const json = JSON.stringify(await serialiseInline()).replace(/</g, "\\u003c");
  const out = src.replace(seedRe(), '<script id="seed" type="application/json">' + json + '<\/script>');
  if (out === src) throw {code:"no_seed", message:"nowhere in the page to write the notebook"};
  if (out.length > 9e6) throw {code:"too_large", message:"the notebook and its photographs are too big to embed"};
  await CAP.publish(out);                    /* on success every view, this one included, reloads */
}

async function save(){
  if (RO) return;
  if (!CAP){ warnSave("no_host"); return; }
  const btn = $("#b-save"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    if (FILES_OK){
      try {
        await saveFiles();
        for (const [id,blob] of BLOBS) KEEP.set(id, blob);
        BLOBS.clear(); SAVE_ERR = null; $("#savewarn").hidden = true; dirty(false);
        const first = !save.done; save.done = true;
        toast(first ? "Saved. Carry on — nothing is locked, and the next save picks up from here."
            : SAVED_BYTES ? `Saved — ${(SAVED_BYTES/1048576).toFixed(1)} MB of photographs published.` : "Saved.",
          first ? 4200 : 2400);
        return;
      } catch(err){
        const c = err && err.code;
        if (c === "capability_disabled" || c === "capability_removed" || c === "read_only_path"){
          FILES_OK = false;                  /* this viewer cannot write single files */
          toast("Saving the quick way is not available here — writing the whole page instead.", 3600);
        } else throw err;
      }
    }
    await saveWholePage();
    toast("Saved. The page is reloading to what you just saved.", 4000);
  } catch(err){
    const code = (err && err.code) || "upstream_error";
    if (code === "conflict"){ toast("Someone saved first — this view is reloading to their version."); return; }
    if (code === "not_writer" || code === "not_granted"){
      goReadOnly("You can look at this notebook but not write to it. Export keeps a copy of anything you changed.");
      return;
    }
    /* Everything else leaves editing exactly as it was. The work is in the
       browser and is fine; it is only the write that failed. */
    warnSave(code, err && err.message);
    dirty(true);
  }
}
function warnSave(code, msg){

    no_seed: "This version of the page has no place to write the notebook into. Use Export, then tell Claude.",
    too_large: "The notebook and its photographs are larger than one page can hold. Delete a few photographs, or split the notebook, then save again.",
    no_room: "This browser would not store the notebook — usually private browsing, or the site's storage is full. Export keeps a copy you can open anywhere.",
    rate_limited: "Saved too often in a short time. Wait half a minute and press Save again.",
    invalid_content: "The page that was submitted was not accepted. Use Export to keep your work and tell Claude.",
    upstream_error: "The save did not get through. Press Save again in a moment; if it keeps failing, use Export."

  w.onclick = () => openModal(
    `<h3>Not saved</h3><div class="mb"><p class="note">${esc(why)}</p>

async function exportJSON(){
  const data = JSON.stringify(serialise(), null, 2);
  const name = (NB.title||"notebook").toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40) + ".json";
  const dl = await use("downloads");
  if (dl){ try { await dl.save({filename:name, data}); toast("Copy saved."); return; } catch(_){} }
  const url = URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);

/* ════ BOOT ═════════════════════════════════════════════════ */
function use(n){
  try { if (window.claude && typeof window.claude.use === "function") return window.claude.use(n); }
  catch(_){}
  return Promise.resolve(null);
}
/* Text was styled by a "preset" before roles existed. Carry the old
   choice across so nothing that was already written changes face. */
const OLD_PRESET = {display:["title","disp"], body:["body","body"], label:["label","mono"],
  hand:["body","hand"], type:["body","type"]};
function migrate(b){
  if (b.t === "text" && !b.role){
    const m = OLD_PRESET[b.preset] || OLD_PRESET.body;
    b.role = m[0]; if (!b.font) b.font = m[1];
  }
  delete b.preset;
  return b;
}
function adopt(d){
  if (!d || !Array.isArray(d.sections) || !d.sections.length) return false;
  NB = {title: d.title || "My journal", version:3, sections:d.sections,
    stencils: Array.isArray(d.stencils) ? d.stencils : [],
    stenOn: d.stenOn !== false, stenSnap: d.stenSnap !== false, rulers: !!d.rulers,
    bind: d.bind || "single", gutter: d.gutter == null ? 56 : d.gutter,
    spine: d.spine || "stitch", gutterShade: d.gutterShade !== false,
    nums: d.nums !== false, anim: d.anim !== false, readonly: !!d.readonly,
    kit: KITS[d.kit] ? d.kit : "Bench",
    templates: Array.isArray(d.templates) ? d.templates : [],
    daily: d.daily || null};
  /* the cover used to be one hidden thing on the notebook; it is a
     page now, so fold the old one into the front of the first section */
  if (d.cover && d.cover.on !== false && !NB.sections.some(x => x.pages.some(isCover))){
    const old = d.coverPage && Array.isArray(d.coverPage.blocks) ? d.coverPage : {blocks:[]};
    NB.sections[0].pages.unshift({id: old.id || uid(), name:"Cover", kind:"cover",
      size: old.size || "land", paper:"plain", blocks: old.blocks || [],
      cover:{material:d.cover.material||"cloth", color:d.cover.color||"#3A4E4A",
        style:d.cover.style||"label", foil:d.cover.foil||"#D9C08A",
        title:d.cover.title != null ? d.cover.title : (d.title||""), sub:d.cover.sub||""}});
  }
  for (const sc of NB.sections) for (const p of sc.pages)
    if (isCover(p)) p.blocks = (p.blocks||[]).map(b => migrate({rot:0, ...b}));
  for (const s of NB.sections){
    s.color = s.color || SECT_COLORS[0];
    s.pages = (s.pages||[]).map(p => ({size:"land", paper:"plain", sten:null, blocks:[], ...p}));
    if (!s.pages.length) s.pages = [{id:uid(), name:"Page 1", size:"land", paper:"plain", sten:null, blocks:[]}];
    for (const p of s.pages) p.blocks = (p.blocks||[]).map(b => migrate({rot:0, ...b}));
  }
  return true;
}
(async function boot(){
  let loaded = false;
  try { const r = await fetch("data/notebook.json",{cache:"no-store"}); if (r.ok) loaded = adopt(await r.json()); }
  catch(_){}
  if (!loaded){                                  /* a whole-page save bakes it in here */
    try { const el = document.getElementById("seed");
      if (el) loaded = adopt(JSON.parse(el.textContent)); } catch(_){}
  }
  if (!loaded){ try { const d = localStorage.getItem("pb.draft"); if (d) loaded = adopt(JSON.parse(d)); } catch(_){} }
  if (!loaded) NB = seed();
  $("#nbname").value = NB.title;
  drawAll(); fitPage(false); dirty(!loaded);
  if (NB.readonly){                     /* a standalone copy: read it, do not edit it */
    goReadOnly(); setPresent(true);
    $("#b-present").hidden = false;
    return;
  }
  CAP = await use("artifact");
  if (!CAP){
    /* served as an ordinary web page: there is nothing to publish into,
       so Save becomes the thing that actually keeps the work */
    HOSTLESS = true;
    const b = $("#b-save");
    b.hidden = false; b.disabled = false;
    b.title = "Keep it in this browser — there is nothing to publish to here";
    b.onclick = saveLocal;
    dirty(DIRTY);
  }
  const back = await restorePhotos();
  if (back) toast(`${back} photograph${back>1?"s":""} back from this browser's store.`, 3000);
  if (!loaded) toast("Double-click the page to write. Press P for the pen. Drop photos anywhere.", 5200);
})();
/* ═══════════════════════════════════════════════════════════════
   PART F — saving where there is no host, and page templates.
   ═══════════════════════════════════════════════════════════════ */

/* ── PHOTOGRAPHS THAT SURVIVE A RELOAD ───────────────────────
   A `blob:` URL dies with the page, so a notebook kept only in
   localStorage came back with empty frames. The pictures go in
   IndexedDB under the block's own id and are rehydrated on load.
   Everything here fails soft: a browser with storage switched off
   gets a notebook with no photographs, not a broken page.       */
const IDB_NAME = "notebook-portfolio", IDB_STORE = "photos";
let IDB = null;
function idb(){
  if (IDB) return IDB;
  IDB = new Promise(res => {
    try {
      const rq = indexedDB.open(IDB_NAME, 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    } catch(_){ res(null); }
  });
  return IDB;
}
async function idbDo(mode, fn){
  const d = await idb(); if (!d) return null;
  try {
    return await new Promise((res, rej) => {
      const tx = d.transaction(IDB_STORE, mode);
      const rq = fn(tx.objectStore(IDB_STORE));
      if (rq){ rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }
      else tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  } catch(_){ return null; }
}
const idbPut = (id, blob) => idbDo("readwrite", s => s.put(blob, id));
const idbGet = id        => idbDo("readonly",  s => s.get(id));
const idbDel = id        => idbDo("readwrite", s => s.delete(id));

/* Put every photograph back on the page it belongs to. Called once
   at boot, after the notebook has been adopted. */
async function restorePhotos(){
  const pages = NB.sections.flatMap(s => s.pages);
  let back = 0;
  for (const p of pages) for (const b of p.blocks){
    if (!("src" in b)) continue;
    const live = b.src && !String(b.src).startsWith("blob:");
    if (live) continue;                       /* a data: or media/ path is fine as it is */
    const blob = await idbGet(b.id);
    if (!blob) { if (b.src) b.src = null; continue; }
    b.src = URL.createObjectURL(blob);
    KEEP.set(b.id, blob);                     /* so a later save can publish it */
    back++;
  }
  if (back){ drawBlocks(); drawSide(); }
  return back;
}

/* ── SAVING WITH NOWHERE TO PUBLISH ──────────────────────────
   Opened from a folder or off a web server there is no artifact to
   write a version into — but "you must export to keep anything" is
   a bad answer. This keeps the notebook in the browser properly,
   photographs included, and says so plainly.                    */
async function saveLocal(){
  const btn = $("#b-save");
  btn.disabled = true; btn.textContent = "Saving…";
  let n = 0;
  try {
    for (const [id, blob] of BLOBS){ await idbPut(id, blob); KEEP.set(id, blob); n++; }
    BLOBS.clear();
    localStorage.setItem("pb.draft", JSON.stringify(serialise()));
    dirty(false);
    const first = !saveLocal.done; saveLocal.done = true;
    toast(first
      ? "Kept in this browser, photographs and all. It will be here when you come back — " +
        "use Export for a copy you can move."
      : n ? `Saved — ${n} photograph${n>1?"s":""} kept.` : "Saved.", first ? 5200 : 2400);
  } catch(err){
    dirty(true);
    warnSave("no_room", err && err.message);
  }
}

/* ── PAGE TEMPLATES ──────────────────────────────────────────
   A daily page has a shape you settle into. Rebuilding it every
   morning, or duplicating yesterday and editing the date, is the
   friction this removes: lay one out, keep it, stamp it out.   */
function templates(){ return NB.templates || (NB.templates = []); }

/* Anything dated on a stamped-out page means the day it was stamped,
   not the day the template was designed. */
function stampToday(blocks){
  const iso = today().iso;
  for (const b of blocks){
    if (b.t !== "date") continue;
    b.iso = iso;
    delete b.sub;                              /* let the weekday follow the date */
    if (b.fmt === "custom") delete b.fmt;
  }
  return blocks;
}
function cloneBlocks(list){
  return list.map(b => {
    const c = JSON.parse(JSON.stringify(b));
    c.id = uid();
    const bl = blobFor(b.id);
    if (bl){ BLOBS.set(c.id, bl); c.src = URL.createObjectURL(bl); }
    return c;
  });
}
function pageFromTemplate(t, name){
  const p = {id:uid(), name: name || t.name, size:t.size || "land",
    paper:t.paper || "plain", sten:t.sten || null, blocks:stampToday(cloneBlocks(t.blocks || []))};
  if (t.kind === "cover"){ p.kind = "cover"; p.cover = JSON.parse(JSON.stringify(t.cover || {})); }
  return p;
}
function dailyTemplate(){
  return templates().find(t => t.id === NB.daily) || null;
}

async function saveTemplate(){
  const p = page();
  const v = await askText("Keep this page as a template",
    "Its pieces, paper and size — not its name. Dates are re-stamped to the day it is used.",
    p.name && !/^Page /.test(p.name) ? p.name : "My daily page", "Keep");
  if (v == null) return;
  snap();
  const t = {id:"t-"+uid(), name:v.trim() || "Untitled template", size:p.size, paper:p.paper,
    sten:p.sten || null, blocks:JSON.parse(JSON.stringify(p.blocks))};
  if (isCover(p)){ t.kind = "cover"; t.cover = JSON.parse(JSON.stringify(p.cover || {})); }
  templates().push(t);
  if (!NB.daily) NB.daily = t.id;
  dirty(); drawTools();
  toast(`“${t.name}” kept${NB.daily === t.id ? " — and it is what “+ Today” now stamps out" : ""}.`, 4600);
}

function tmplMenu(anchor){
  const list = templates();
  popup(anchor, `<div class="gl">Templates</div>
    <button data-tx="save"><span class="gicon">＋</span>Keep this page as a template…</button>
    ${list.length ? `<hr><div class="gl">Start a page from</div>` +
      list.map(t => `<button data-tnew="${esc(t.id)}"><span class="gicon">▤</span>${esc(t.name)}
        <span class="k">${(t.blocks||[]).length} pieces</span></button>`).join("") +
      `<hr><div class="gl">“+ Today” uses</div>` +
      list.map(t => `<button data-tday="${esc(t.id)}"><span class="gicon">${NB.daily===t.id?"●":"○"}</span>
        ${esc(t.name)}</button>`).join("") +
      `<button data-tday=""><span class="gicon">${NB.daily?"○":"●"}</span>The built-in daily page</button>
       <hr><button data-tx="del"><span class="gicon">🗑</span>Delete a template…</button>`
    : `<hr><div class="gl">Lay a page out the way you like it, then keep it here. “+ Today”
       will stamp it out with the date already right.</div>`}`,
  async e => {
    const nw = e.target.closest("[data-tnew]");
    if (nw){
      const t = templates().find(x => x.id === nw.dataset.tnew); if (!t) return;
      closePop(); snap();
      sec().pages.splice(PI + 1, 0, pageFromTemplate(t));
      PI = PI + 1; SEL.clear(); dirty(); drawAll(); fitPage(false);
      toast(`A page from “${t.name}”.`); return;
    }
    const dy = e.target.closest("[data-tday]");
    if (dy){ snap(); NB.daily = dy.dataset.tday || null; dirty(); closePop(); drawTools();
      toast(NB.daily ? "“+ Today” will use that template." : "“+ Today” is back to the built-in page.");
      return; }
    const x = e.target.closest("[data-tx]"); if (!x) return;
    closePop();
    if (x.dataset.tx === "save") return saveTemplate();
    if (x.dataset.tx === "del"){
      const v = await openModal(`<h3>Delete a template</h3><div class="mb">
        <p class="note">Pages already made from it are not touched.</p>
        ${templates().map(t => `<button class="btn" style="width:100%;justify-content:space-between;
          margin-bottom:6px" data-x="${esc(t.id)}">${esc(t.name)}
          <span class="eyebrow">${(t.blocks||[]).length} pieces</span></button>`).join("")}
        </div><div class="mf"><button class="btn" data-x="">Cancel</button></div>`,
        m => { m.onclick = ev => { const b = ev.target.closest("[data-x]");
          if (b) closeModal(b.dataset.x || null); }; });
      if (!v) return;
      snap();
      NB.templates = templates().filter(t => t.id !== v);
      if (NB.daily === v) NB.daily = null;
      dirty(); drawTools(); toast("Template deleted.");
    }
  });
}
</script>
